name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fatia 9.7: o CI só rodava backend — frontend e E2E nunca eram verificados,
# então uma quebra de tela ou de jornada só aparecia na máquina de quem rodava
# manualmente. Agora os três rodam, com Postgres e Redis reais para o E2E.
env:
  DATABASE_URL: postgresql://vendedor_app:senha@localhost:5432/app_vendedor_sapatinho_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-jwt-secret-com-mais-de-32-caracteres-ok
  CPF_HASH_SECRET: ci-cpf-hash-secret-com-mais-de-32-caracteres
  # Valores de CI, nunca segredos reais — o backend em CI roda sempre com o
  # provider MOCK, sem nenhuma chamada externa de IA.
  AI_PROVIDER: mock

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vendedor_app
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: app_vendedor_sapatinho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendedor_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

      - name: Aponta .env.test para o Postgres do CI
        run: echo "DATABASE_URL=$DATABASE_URL" > .env.test

      - name: Aplica migrations no banco de teste
        run: npx prisma migrate deploy

      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vendedor_app
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: app_vendedor_sapatinho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendedor_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências (backend e frontend)
        run: |
          npm ci
          npm ci --prefix web

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Semeia o banco
        run: npm run seed

      - name: Instala navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Sobe a API em background
        run: npm run dev &
        env:
          PORT: 3010
          # Headroom de rate limit: o Playwright faz dezenas de logins em
          # segundos, sem a cadência de um humano (mesmo motivo do .env local).
          LOGIN_RATE_LIMIT_PER_MINUTE: 500
          API_RATE_LIMIT_PER_MINUTE: 2000

      - name: Espera a API responder
        # Loop com curl em vez de `wait-on`: não vale adicionar dependência só
        # pra isso (o Vite quem sobe é o próprio Playwright, via webServer).
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3010/health > /dev/null; then echo "API no ar"; exit 0; fi
            sleep 1
          done
          echo "API não respondeu em 60s"; exit 1

      - name: Roda as jornadas E2E
        run: npm run test:e2e
        working-directory: web
        env:
          VITE_API_URL: http://localhost:3010

      - name: Guarda evidências quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
