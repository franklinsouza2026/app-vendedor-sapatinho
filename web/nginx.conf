# Nginx do PWA (Fatia 9.7). Serve o build estático e faz proxy de /api pro
# backend, de modo que frontend e API compartilhem a MESMA origem — assim o
# CORS não precisa ser afrouxado em produção.
#
# ARMADILHA DO NGINX que rege a repetição abaixo: `add_header` num `location`
# DESCARTA todos os headers herdados do nível `server`. Por isso os blocos que
# precisam de Cache-Control próprio repetem os headers de segurança — sem isso,
# justamente o /index.html (o documento que pode ser enquadrado num iframe)
# ficaria sem X-Frame-Options.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeçalhos de segurança da SPA. `helmet()` protege só as respostas da API
    # — o index.html e os assets saem daqui. Sem isto o app inteiro é embutível
    # num iframe; vetor concreto: um site hostil enquadra /admin/usuarios/<id> e
    # induz um Admin logado a clicar em "Reemitir acesso" ou "Remover meta" (o
    # Bearer vem do próprio app, então o CORS não protege).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `connect-src 'self'` basta porque a API é servida pela mesma origem via o
    # proxy /api/ abaixo. Sem 'unsafe-eval'.
    #
    # `frame-src` é OBRIGATÓRIO aqui: as aulas da Academia embutem vídeo de
    # YouTube/Vimeo num <iframe> (Academia.tsx + utils/video.ts, que já valida
    # o host). Sem essa diretiva o fallback é `default-src 'self'` e TODO vídeo
    # de aula é bloqueado pelo navegador — em silêncio, só com erro no console.
    # A allowlist aqui espelha exatamente a de `urlDeEmbedSegura`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # index.html nunca é cacheado: é ele que aponta pros bundles com hash, e
    # uma cópia velha travaria o usuário numa versão antiga do app.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # O service worker também nunca é cacheado — mesma razão.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Proxy da API. O `/` final do proxy_pass remove o prefixo: /api/auth/login
    # vira /auth/login no backend (é por isso que o bundle é construído com
    # VITE_API_URL=/api — ver web/Dockerfile).
    #
    # `X-Forwarded-For` é o que faz o rate limit do Express enxergar o IP real
    # do cliente — e é por isso que a API roda com TRUST_PROXY_HOPS contando
    # exatamente estes saltos, nunca `true`.
    location /api/ {
        # Resolver do Docker + upstream em variável (Fatia 9.7): com o nome
        # literal no proxy_pass, o nginx resolve o DNS UMA vez, no load — se o
        # container `api` reiniciar com outro IP, o proxy fica apontando pro IP
        # velho até um reload manual. E o nginx nem sobe se `api` ainda não
        # existir no momento do boot.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        # `break` + proxy_pass sem URI preserva a remoção do prefixo /api/.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html (react-router resolve).
    # Sem `add_header` próprio — herda os headers de segurança do `server`.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
