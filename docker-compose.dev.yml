# Sobe só Postgres + Redis pra rodar a API/worker localmente via `npm run dev`
# (fora de container, mais rápido pra iterar). Uso: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: senha
      POSTGRES_USER: vendedor_app
      POSTGRES_DB: app_vendedor_sapatinho
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  postgres_dev_data:
    driver: local
