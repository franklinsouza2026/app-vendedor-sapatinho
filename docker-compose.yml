
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: vendedor_app
      POSTGRES_DB: app_vendedor_sapatinho
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendedor_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: app-vendedor-sapatinho
      DATABASE_URL: postgresql://vendedor_app:${POSTGRES_PASSWORD}@postgres:5432/app_vendedor_sapatinho
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ERP_MODE: ${ERP_MODE:-mock}
      LINX_API_URL: ${LINX_API_URL:-}
      LINX_API_KEY: ${LINX_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - app_net

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      APP_NAME: app-vendedor-sapatinho-worker
      DATABASE_URL: postgresql://vendedor_app:${POSTGRES_PASSWORD}@postgres:5432/app_vendedor_sapatinho
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ERP_MODE: ${ERP_MODE:-mock}
      LINX_API_URL: ${LINX_API_URL:-}
      LINX_API_KEY: ${LINX_API_KEY:-}
    depends_on:
      api: { condition: service_started }
    networks:
      - app_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_net:
    driver: bridge
