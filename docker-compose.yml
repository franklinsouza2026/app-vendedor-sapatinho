
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: vendedor_app
      POSTGRES_DB: app_vendedor_sapatinho
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SEM `ports:` (T7): banco só na rede interna. Backup/restore por
    # `docker compose exec postgres pg_dump …` (docs/FASE-1-DEPLOY.md).
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendedor_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction (Fase 1, T7): o Redis guarda a FILA (BullMQ) e o bloqueio de
    # login. Com allkeys-lru, sob pressão de memória ele descartaria jobs de
    # sync e contadores de força bruta em silêncio — o BullMQ avisa no boot.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Job de uso único: aplica as migrations versionadas antes de api/worker subirem.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vendedor_app:${POSTGRES_PASSWORD}@postgres:5432/app_vendedor_sapatinho
      JWT_SECRET: ${JWT_SECRET}
      CPF_HASH_SECRET: ${CPF_HASH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTEGRATION_SECRETS_ENCRYPTION_KEY: ${INTEGRATION_SECRETS_ENCRYPTION_KEY}
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - app_net

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: app-vendedor-sapatinho
      # Allowlist de origens (Fatia 9.7) — obrigatória com NODE_ENV=production.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Nº de proxies à frente da API. Número explícito, NUNCA `true` — com
      # `true` o Express confia na cadeia X-Forwarded-For inteira, que o cliente
      # controla, e um atacante ganharia um bucket de rate limit novo por
      # request (força bruta ilimitada no login).
      #
      # ⚠️ VERIFICAR ANTES DE PUBLICAR: o valor tem que bater com a topologia
      # REAL. Só o nginx deste compose = 1. Se houver um proxy/TLS no host à
      # frente (o serviço `web` publica em 127.0.0.1, o que sugere isso), são 2.
      # Errar pra menos faz TODOS os usuários caírem no mesmo bucket: 10
      # logins/min para a empresa inteira, e o limitador perde o valor
      # defensivo. Confirme com uma rota que ecoe `req.ip` antes de confiar.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgresql://vendedor_app:${POSTGRES_PASSWORD}@postgres:5432/app_vendedor_sapatinho
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Fatia 9.7: obrigatório em `src/config.ts` — sem ele a validação de env
      # derruba api e worker no boot (`docker compose up` não subia).
      CPF_HASH_SECRET: ${CPF_HASH_SECRET}
      # Opcional: sem ele o provider MOCK segue funcionando; só impede salvar
      # credencial real de IA.
      AI_SECRETS_ENCRYPTION_KEY: ${AI_SECRETS_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      # Fase 1: chave mestra das credenciais de integração (AES-256-GCM),
      # FORA do banco. Obrigatória em produção (o boot falha sem ela).
      INTEGRATION_SECRETS_ENCRYPTION_KEY: ${INTEGRATION_SECRETS_ENCRYPTION_KEY}
      ERP_SYNC_CRON: ${ERP_SYNC_CRON:-*/15 * * * *}
      MODULOS_LEGADOS_ATIVOS: "false"
    # SEM `ports:` de propósito (Fatia 9.7). A API é alcançada só pela rede
    # interna, via o proxy do serviço `web`.
    #
    # Publicar a 3000 no host anulava o rate limit: com TRUST_PROXY_HOPS=1 o
    # Express confia no último salto de X-Forwarded-For, então qualquer um que
    # alcançasse 127.0.0.1:3000 diretamente (usuário local, túnel SSH, outro
    # container da rede) ganhava um bucket novo por request — força bruta
    # ilimitada no login. Fechando a porta, o único caminho até a API é o nginx,
    # que reescreve o header, e o "1 hop" volta a ser verdade.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks:
      - app_net

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    # O worker não serve HTTP: a saúde é a própria batida que ele grava a cada
    # minuto (a mesma que o Admin vê em "Saúde dos dados").
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck-worker.js"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    environment:
      NODE_ENV: production
      APP_NAME: app-vendedor-sapatinho-worker
      DATABASE_URL: postgresql://vendedor_app:${POSTGRES_PASSWORD}@postgres:5432/app_vendedor_sapatinho
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Fatia 9.7: obrigatório em `src/config.ts` — sem ele a validação de env
      # derruba api e worker no boot (`docker compose up` não subia).
      CPF_HASH_SECRET: ${CPF_HASH_SECRET}
      # Opcional: sem ele o provider MOCK segue funcionando; só impede salvar
      # credencial real de IA.
      AI_SECRETS_ENCRYPTION_KEY: ${AI_SECRETS_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      # Fase 1: chave mestra das credenciais de integração (AES-256-GCM),
      # FORA do banco. Obrigatória em produção (o boot falha sem ela).
      INTEGRATION_SECRETS_ENCRYPTION_KEY: ${INTEGRATION_SECRETS_ENCRYPTION_KEY}
      ERP_SYNC_CRON: ${ERP_SYNC_CRON:-*/15 * * * *}
      MODULOS_LEGADOS_ATIVOS: "false"
    depends_on:
      api: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    networks:
      - app_net

  # Fatia 9.7: o PWA não tinha caminho de deploy nenhum neste repo — o compose
  # subia api+worker+postgres+redis e nada servia `web/dist`. Nginx estático,
  # que também faz o proxy de /api pro backend (daí TRUST_PROXY_HOPS=1).
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Só necessário com mais de uma empresa no banco (login escolhe a empresa).
        VITE_EMPRESA_ID: ${VITE_EMPRESA_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_started }
    networks:
      - app_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_net:
    driver: bridge
